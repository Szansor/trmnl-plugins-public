---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor: ''
polling_url: "https://api.zbiorkom.live/api6-open/warsaw/stops/{{ stop | split: \"/\" | last | split: \"?\" | first | strip }}?limit=15{% if lines != blank %}&routes={{ lines | remove: \" \" }}{% endif %}\r\nhttps://api.open-meteo.com/v1/forecast?latitude={{ weather_location | split: \",\" | first | strip }}&longitude={{ weather_location | split: \",\" | last | strip }}&current=temperature_2m,weather_code,is_day&timezone=Europe%2FWarsaw&forecast_days=1"
polling_headers: ''
polling_body: ''
id: 541707
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  category: travel
  github_url: https://github.com/Szansor/trmnl-plugins-public
  learn_more_url: https://github.com/Szansor/trmnl-plugins-public/tree/main/odjazdy-wtp
  description: 'Live departures from any public transport stop in Warsaw, Poland (WTP buses and trams): the real departure time, the delay against the timetable and the next few departures. Optionally a small weather icon with the temperature.<br/><br/><b>Setup:</b> open <a href="https://zbiorkom.live/warsaw">zbiorkom.live/warsaw</a>, tap your stop (a specific pole, e.g. Centrum 01) and paste the page address from your browser into the field below. If the screen says "Stop not found", copy the link again.<br/><br/>Times are real (timetable + live GPS delay). An e-paper screen does not refresh every minute, so the plugin shows clock times instead of a countdown, plus the time the data was fetched. The screen can be shown in English or Polish.<br/><br/>Data: <a href="https://zbiorkom.live">zbiorkom.live</a> (open data from WTP / City of Warsaw), weather: <a href="https://open-meteo.com">Open-Meteo</a>. Source code (MIT) and issues: <a href="https://github.com/Szansor/trmnl-plugins-public">GitHub</a>.<br/><br/><i>Polski: odjazdy na żywo z dowolnego przystanku w Warszawie. Język ekranu (English / Polski) wybierzesz w ustawieniach poniżej.</i>'
- keyname: stop
  field_type: string
  name: Stop (zbiorkom.live link)
  description: The stop page address from <a href="https://zbiorkom.live/warsaw">zbiorkom.live/warsaw</a>, or just the stop ID, e.g. centrum01-0fb5f.
  default: https://zbiorkom.live/warsaw/stop/centrum01-0fb5f
  placeholder: https://zbiorkom.live/warsaw/stop/centrum01-0fb5f
- keyname: stop_name
  field_type: string
  name: Stop name on screen
  description: Shown in the title, e.g. Centrum 01.
  default: Centrum 01
  placeholder: Centrum 01
  optional: true
- keyname: lines
  field_type: string
  name: Only these lines
  description: Line numbers separated by commas, e.g. 175,520. Leave empty to show every line at the stop.
  placeholder: '175,520'
  optional: true
- keyname: language
  field_type: select
  name: Screen language
  description: Language of the labels on the screen. Stop and destination names always stay in Polish.
  options:
  - English: en
  - Polski: pl
  default: en
- keyname: show_weather
  field_type: select
  name: Weather in the corner
  description: A small weather icon and the temperature next to the departures.
  options:
  - 'Yes': 'yes'
  - 'No': 'no'
  default: 'yes'
  conditional_validation:
  - when: 'no'
    hidden:
    - weather_location
- keyname: weather_location
  field_type: lat_lon
  name: Weather location
  description: Search for an address or enter coordinates, ideally near your stop.
  default: 52.2291,21.0119
name: Warsaw Transit Departures
description: Live departures from Warsaw stops
refresh_interval: 15
